name: Translations

# Repairs articles that were published while a translation call was failing.
# Run it manually after a bad batch, or on a schedule as a safety net.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max articles to repair (empty = all)
        default: ''
      concurrency:
        description: Articles translated in parallel (empty = 2)
        default: '2'
  schedule:
    # Twice a day. Every run ends in a push to main, and every push is a
    # Vercel deployment - the plan allows 100 of them a day for the account.
    - cron: '40 5,17 * * *'

permissions:
  contents: write

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drop fake translations (English text stored as a translation)
        run: node scripts/repair-translations.mjs
      - name: Translate missing locales
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: ${{ inputs.concurrency || '2' }}
          RETRIES: '3'
          # The job is killed at 55 minutes and a killed job never commits.
          # Leave room for the index rebuild and the push.
          TIME_BUDGET_MIN: '42'
        run: node scripts/translate-missing.mjs
      - name: Commit repaired translations
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The newsroom and the live tickers push to content/ while this run is
          # busy, so a rebase can stop on content/index.json. The old
          # `git pull --rebase ... || true` then committed conflict markers and
          # blanked the front page. The push script aborts such a rebase and
          # merges instead, then rebuilds the index from the article files.
          if [ -f translated-slugs.txt ]; then
            node scripts/sync-index.mjs --file translated-slugs.txt
          fi
          node scripts/check-content.mjs --fix
          bash scripts/push-content.sh "translations: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "the translations are committed but not published"
