name: Translations

# Repairs articles that were published while a translation call was failing.
# Run it manually after a bad batch, or on a schedule as a safety net.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max articles to repair (empty = all)
        default: ''
  schedule:
    - cron: '40 */4 * * *'

permissions:
  contents: write

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drop fake translations (English text stored as a translation)
        run: node scripts/repair-translations.mjs
      - name: Translate missing locales
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: '3'
          RETRIES: '3'
        run: node scripts/translate-missing.mjs
      - name: Commit repaired translations
        if: always()
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          # The newsroom and the live tickers push to content/ while this run is
          # busy, so a rebase can stop on content/index.json. The old
          # `git pull --rebase ... || true` then committed conflict markers and
          # blanked the front page. Never continue while a rebase is in
          # progress: abort it and merge instead, then repair the index.
          sync_upstream() {
            for attempt in 1 2 3 4 5; do
              if git pull -q --rebase --autostash; then return 0; fi
              git rebase --abort 2>/dev/null || true
              if git fetch -q origin main && git merge -q --no-edit -X ours origin/main; then
                node scripts/sync-index.mjs --missing || true
                node scripts/check-content.mjs --fix || return 1
                git add content
                git commit -q -m "translations: merge upstream" || true
                return 0
              fi
              git merge --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            return 1
          }
          sync_upstream || { echo "could not sync with origin/main"; exit 1; }
          if [ -f translated-slugs.txt ]; then
            node scripts/sync-index.mjs --file translated-slugs.txt
          fi
          node scripts/check-content.mjs --fix
          git add content
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "translations: $(date -u +'%Y-%m-%d %H:%M') UTC"
          sync_upstream || { echo "could not sync with origin/main"; exit 1; }
          git push -q || { sleep 10; sync_upstream && git push -q; }
