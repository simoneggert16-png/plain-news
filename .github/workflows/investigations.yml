name: Investigations

on:
  schedule:
    # Morning and evening shift. Every run works in three shifts, so a story
    # moves on several times a day. The desk opens a new investigation only
    # while it has room in its weekly quota.
    - cron: '10 6,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Research and write, but publish/send nothing (logs only)'
        type: boolean
        default: true
      slug:
        description: 'Only advance this dossier slug (empty = all active)'
        type: string
        required: false
      intake:
        description: 'Force the weekly intake even if it already ran'
        type: boolean
        default: false
      agent_steps:
        description: 'Agent steps per dossier (empty = 12, use small numbers to test)'
        type: string
        required: false
      only:
        description: 'Diagnostics: "agent" runs only the agent for one dossier'
        type: string
        required: false
      minutes:
        description: 'Time budget in minutes (empty = 55)'
        type: string
        required: false
      force_draft:
        description: 'Write the draft even if the gates are not met (a human still approves it)'
        type: boolean
        default: false
      approve:
        description: 'Approve this dossier slug and publish it (the editor approved it)'
        type: string
        required: false
      approve_outreach:
        description: 'Free these letters for sending: <slug>:<letter ids, comma separated>'
        type: string
        required: false
      reject_outreach:
        description: 'Turn these letters down: <slug>:<letter ids, comma separated>'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: investigations
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    # Three shifts of about 18 minutes each, plus the commit and the mirror.
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rebase on main
        run: git pull --rebase --autostash

      - name: Deployment budget
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Every push to main is a Vercel deployment, and the Hobby plan
          # allows 100 of them a day. The count is only a warning now: the
          # dossiers live in the repository, and the site reads them from
          # there. A refused build must not stop the desk from working.
          if [ -n "${{ inputs.approve }}" ] || [ -n "${{ inputs.approve_outreach }}" ] || [ -n "${{ inputs.reject_outreach }}" ]; then
            echo "A human approved a piece - it goes out."
          else
            node scripts/deploy-budget.mjs || echo "the day's deployments are spent - the dossier still goes to the repository"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Advance the investigative desk
        if: steps.budget.outputs.skip != 'true'
        timeout-minutes: 140
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          DESK_EMAIL_DOMAIN: ${{ vars.DESK_EMAIL_DOMAIN }}
          EDITORIAL_EMAIL: ${{ vars.EDITORIAL_EMAIL }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          INVESTIGATE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          INVESTIGATE_SLUG: ${{ inputs.slug || '' }}
          INVESTIGATE_INTAKE: ${{ inputs.intake == true && '1' || '' }}
          INVESTIGATE_AGENT_STEPS: ${{ inputs.agent_steps || '12' }}
          INVESTIGATE_ONLY: ${{ inputs.only || '' }}
          INVESTIGATE_MIN_SOURCES: '8'
          INVESTIGATE_MIN_PRIMARY: '2'
          INVESTIGATE_MIN_CLAIMS: '6'
          INVESTIGATE_MIN_WORDS: '2500'
          INVESTIGATE_REPLY_HOURS: '72'
          INVESTIGATE_MAX_READS: '6'
          INVESTIGATE_MINUTES: ${{ inputs.minutes || '55' }}
          INVESTIGATE_FORCE_DRAFT: ${{ inputs.force_draft == true && '1' || '' }}
          INVESTIGATE_APPROVE: ${{ inputs.approve || '' }}
          INVESTIGATE_APPROVE_OUTREACH: ${{ inputs.approve_outreach || '' }}
          INVESTIGATE_REJECT_OUTREACH: ${{ inputs.reject_outreach || '' }}
          INVESTIGATE_APPROVED_BY: ${{ vars.INVESTIGATE_APPROVED_BY || 'editor' }}
          INVESTIGATE_LOCALES: 'en,de,fr,es,it,pt'
          INVESTIGATE_TRANSLATE_CONCURRENCY: '2'
        run: |
          # A desk works in shifts. Each shift reads the mailbox, takes up what
          # is on the desk and writes down what it found. Several shifts per
          # run let a story move on while nobody is watching; the commit comes
          # after the last one, so a day still costs a single deployment.
          TOTAL="${INVESTIGATE_MINUTES:-55}"
          SHIFTS="${DESK_SHIFTS:-3}"
          PER=$(( TOTAL / SHIFTS ))
          [ "$PER" -lt 8 ] && PER=8
          for i in $(seq 1 "$SHIFTS"); do
            echo "──────── shift $i of $SHIFTS ($PER min) ────────"
            INVESTIGATE_MINUTES="$PER" timeout $(( PER * 60 + 300 )) node bots/investigate.mjs || echo "shift $i ended with $?"
          done
          # What the live tickers wrote to content/ in the meantime is taken in
          # by the commit below, which knows how to merge both sides.

      # The work is committed before the mirror runs. A slow upload must never
      # cost the desk its findings.
      - name: Commit dossiers and published investigations
        if: always() && steps.budget.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The live tickers write to content/ every few minutes as well. A
          # push that races with them must not lose the piece: the push script
          # keeps the commit, rebuilds the index from the article files and
          # pushes exactly once.
          bash scripts/push-content.sh "investigations: $(date -u +'%Y-%m-%d %H:%M') UTC" || {
            echo "the dossiers are committed but not published"
            exit 1
          }

      - name: Mirror content to Supabase
        if: always()
        # A dead database must not hold the shift for twelve minutes. Four
        # are enough for a slow mirror and short for an unreachable one.
        timeout-minutes: 4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-content.mjs || echo "supabase mirror skipped"
