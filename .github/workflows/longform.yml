name: Long reads

on:
  schedule:
    # Three times a day: morning, midday, evening (UTC). Each run publishes
    # up to LONGFORM_PER_RUN pieces and skips themes already covered.
    - cron: '40 4,11,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and write, but publish nothing (logs only)'
        type: boolean
        default: false
      per_run:
        description: 'How many long reads to publish in this run (1-3)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: longform
  cancel-in-progress: false

jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rebase on main
        run: git pull --rebase --autostash

      - name: Write long reads
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          LONGFORM_PER_RUN: ${{ inputs.per_run || '3' }}
          LONGFORM_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LONGFORM_LOOKBACK_HOURS: '48'
          LONGFORM_PER_FEED: '30'
          LONGFORM_MIN_SOURCES: '2'
          LONGFORM_MIN_WORDS: '950'
          LONGFORM_LOCALES: 'en,de,fr,es,it,pt'
          LONGFORM_TRANSLATE_CONCURRENCY: '3'
        run: node bots/longform.mjs

      - name: Mirror content to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-content.mjs || echo "supabase mirror skipped"

      - name: Commit long reads
        if: always()
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          git add content
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "longform: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
