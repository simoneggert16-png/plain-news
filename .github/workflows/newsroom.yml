name: Newsroom

on:
  schedule:
    # Every hour at :17 UTC; target up to 2 stories per editorial category.
    - cron: '17 * * * *'
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run AI newsroom
        timeout-minutes: 130
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          MAX_STORIES_PER_RUN: '0'
          MAX_PER_CATEGORY: '0'
          MIN_PER_CATEGORY_PER_CYCLE: '1'
          TARGET_PER_CATEGORY_PER_CYCLE: '0'
          EVENT_CONCURRENCY: ${{ vars.EVENT_CONCURRENCY || '4' }}
          TRANSLATION_CONCURRENCY: ${{ vars.TRANSLATION_CONCURRENCY || '8' }}
          RUN_BUDGET_MINUTES: '110'
          RECENT_WINDOW_HOURS: '1'
          MAX_ARTICLES_PER_DAY: '0'
          MAX_AGE_HOURS: '8'
          PER_FEED: '20'
          DESK_BATCH_SIZE: '60'
          DESK_MAX_BATCHES: '10'
        run: node bots/newsroom.mjs
      - name: Commit new stories
        if: always()
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          git add content
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "newsroom: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
