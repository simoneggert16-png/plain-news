name: Newsroom

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler silently drops most entries of
    # frequent crons: with two daily-ish entries the newsroom actually ran only
    # 4-5 times a day (gaps of 3-6 h), which is why the newest article was
    # routinely hours old. Many triggers plus the cadence guard below yield a
    # real publish cycle roughly every 30-60 min without publishing more often.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write
  actions: write      # the run dispatches the hand-over job at the end

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    # The run loops for ~5 h; the job limit must sit above the step limit.
    timeout-minutes: 360
    steps:
      - name: Cadence guard
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip when the last publish cycle committed content recently.
          #
          # Only "newsroom:" commits count. The live-ticker workflow writes to
          # content/ every 10 minutes, so measuring "the last commit touching
          # content/" would keep the newsroom switched off forever - that is
          # exactly what happened: the tickers ran, the desk never did.
          mins=999
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=content&per_page=40" \
            --jq '[.[] | select(.commit.message | startswith("newsroom:"))][0].commit.committer.date' 2>/dev/null || true)
          if [ -n "$last" ]; then
            mins=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 60 ))
            echo "Last content commit ${mins} min ago ($last)"
          else
            echo "Could not read last content commit; running anyway."
          fi
          # Two hours is the shortest distance between two newsroom publishes:
          # every publish is a Vercel deployment, and the plan allows 100 of
          # them a day for the whole account.
          if [ "$mins" -lt 120 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: published ${mins} min ago."
          fi
      - if: steps.cadence.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Deployment budget
        id: budget
        # Every push to main is a Vercel deployment. The Hobby plan allows 100
        # of them per day; when the budget is spent the builds fail - but the
        # content is in the repository, and the site reads it from there. A
        # refused build must not silence the newsroom, so this step only
        # reports.
        if: steps.cadence.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-budget.mjs || echo "the day's deployments are spent - the content still goes to the repository"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.cadence.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cadence.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        run: npm ci
      - name: Run AI newsroom (looping)
        if: steps.cadence.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        timeout-minutes: 350
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          MAX_STORIES_PER_RUN: '12'
          MAX_PER_CATEGORY: '0'
          MIN_PER_CATEGORY_PER_CYCLE: '1'
          TARGET_PER_CATEGORY_PER_CYCLE: '0'
          EVENT_CONCURRENCY: ${{ vars.EVENT_CONCURRENCY || '4' }}
          TRANSLATION_CONCURRENCY: ${{ vars.TRANSLATION_CONCURRENCY || '8' }}
          RUN_BUDGET_MINUTES: '35'
          RECENT_WINDOW_HOURS: '1'
          MAX_ARTICLES_PER_DAY: '120'
          MAX_AGE_HOURS: '8'
          PER_FEED: '20'
          DESK_BATCH_SIZE: '60'
          DESK_MAX_BATCHES: '4'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's scheduler fires this workflow only a few times per day and
          # scheduled runs regularly arrive 3-7 h late. A single 45-minute run
          # therefore left the newest article hours old. One run now loops for
          # ~5.5 h and publishes about once an hour, so freshness no longer
          # depends on the scheduler: the next queued trigger continues after.
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          # Every push to main is a Vercel deployment, and the plan allows 100
          # a day. The newsroom alone asked for more than that. So the cycle
          # publishes through bash scripts/push-content.sh, which counts the day's
          # deployments and pushes exactly once - even when the other side
          # wrote to content/ in the meantime.
          deadline=$(( $(date +%s) + 300 * 60 ))
          cycle=0
          published_total=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            cycle=$((cycle + 1))
            started=$(date +%s)
            echo "::group::Cycle $cycle ($(date -u +%H:%M) UTC)"
            node bots/newsroom.mjs || echo "cycle $cycle failed, continuing"
            timeout 600 node scripts/sync-content.mjs || echo "supabase mirror skipped"
            if ! node scripts/check-content.mjs --fix; then
              echo "content/index.json is broken - keeping the cycle local, not committing"
              git reset -q
            else
              pushed=1
              bash scripts/push-content.sh "newsroom: $(date -u +'%Y-%m-%d %H:%M') UTC" || pushed=0
              if [ "$pushed" = 1 ]; then
                published_total=$((published_total + 1))
                echo "published in cycle $cycle"
              else
                echo "cycle $cycle: the content is committed but the push failed"
              fi
            fi
            echo "::endgroup::"
            # Aim for one publish cycle per ~3 h. Every cycle that finds new
            # stories is a push, and every push is a Vercel deployment: at
            # ~90 min the newsroom alone asked for more deployments than the
            # plan allows in a day. Never sleep past the deadline - the step
            # timeout would kill the run before the handover.
            pause=$(( 10800 - ($(date +%s) - started) ))
            if [ "$pause" -gt 60 ] && [ $(( $(date +%s) + pause )) -lt "$deadline" ]; then
              sleep "$pause"
            fi
          done
          echo "Run finished after $cycle cycles ($published_total with new stories)."
      - name: Hand over to the newsroom chain
        # Runs even when the cadence guard skipped this trigger: a skipped run
        # must not break the chain, it just has to try again in 30 minutes.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=content&per_page=40" \
            --jq '[.[] | select(.commit.message | startswith("newsroom:"))][0].commit.committer.date' 2>/dev/null || true)
          if [ -z "$last" ]; then echo "No newsroom commit found - not chaining."; exit 0; fi
          mins=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "Last content commit was ${mins} min ago."
          if [ "$mins" -ge 120 ]; then
            echo "Nothing published for 2 h - not chaining, the cron backstop takes over."
            exit 0
          fi
          gh workflow run newsroom-chain.yml -f delay=1800 && echo "Handed over to the newsroom chain."
