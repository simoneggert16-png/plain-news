name: Newsroom

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler silently drops most entries of
    # frequent crons: with two daily-ish entries the newsroom actually ran only
    # 4-5 times a day (gaps of 3-6 h), which is why the newest article was
    # routinely hours old. Many triggers plus the cadence guard below yield a
    # real publish cycle roughly every 30-60 min without publishing more often.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Cadence guard
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip when the last publish cycle committed content recently. This
          # measures the last commit that touched content/ (an actual publish),
          # not the last run: with many triggers, skipped runs must not reset
          # the clock or the workflow skips itself forever.
          mins=999
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=content&per_page=1" \
            --jq '.[0].commit.committer.date' 2>/dev/null || true)
          if [ -n "$last" ]; then
            mins=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 60 ))
            echo "Last content commit ${mins} min ago ($last)"
          else
            echo "Could not read last content commit; running anyway."
          fi
          if [ "$mins" -lt 25 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: published ${mins} min ago."
          fi
      - if: steps.cadence.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cadence.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cadence.outputs.skip != 'true'
        run: npm ci
      - name: Run AI newsroom (looping)
        if: steps.cadence.outputs.skip != 'true'
        timeout-minutes: 350
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          MAX_STORIES_PER_RUN: '0'
          MAX_PER_CATEGORY: '0'
          MIN_PER_CATEGORY_PER_CYCLE: '1'
          TARGET_PER_CATEGORY_PER_CYCLE: '0'
          EVENT_CONCURRENCY: ${{ vars.EVENT_CONCURRENCY || '4' }}
          TRANSLATION_CONCURRENCY: ${{ vars.TRANSLATION_CONCURRENCY || '8' }}
          RUN_BUDGET_MINUTES: '30'
          RECENT_WINDOW_HOURS: '1'
          MAX_ARTICLES_PER_DAY: '120'
          MAX_AGE_HOURS: '8'
          PER_FEED: '20'
          DESK_BATCH_SIZE: '60'
          DESK_MAX_BATCHES: '10'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # GitHub's scheduler fires this workflow only a few times per day and
          # scheduled runs regularly arrive 3-7 h late. A single 45-minute run
          # therefore left the newest article hours old. One run now loops for
          # ~5.5 h and publishes about once an hour, so freshness no longer
          # depends on the scheduler: the next queued trigger continues after.
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          deadline=$(( $(date +%s) + 330 * 60 ))
          cycle=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            cycle=$((cycle + 1))
            started=$(date +%s)
            echo "::group::Cycle $cycle ($(date -u +%H:%M) UTC)"
            node bots/newsroom.mjs || echo "cycle $cycle failed, continuing"
            node scripts/sync-content.mjs || echo "supabase mirror skipped"
            git add content
            if git diff --cached --quiet; then
              echo "no new stories in cycle $cycle"
            else
              git commit -q -m "newsroom: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull -q --rebase --autostash && git push -q || echo "push failed, continuing"
              echo "published in cycle $cycle"
            fi
            echo "::endgroup::"
            pause=$(( 3300 - ($(date +%s) - started) ))
            if [ "$pause" -gt 60 ]; then sleep "$pause"; fi
          done
          echo "Run finished after $cycle cycles."
