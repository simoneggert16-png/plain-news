name: Smoke

# Catches the class of bug that took the front page down twice: the build
# passes (dynamic pages are not prerendered) but the route returns 500 at
# runtime. Builds production and curls the main routes.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Production check. The build stays green when a dynamic route starts
    # throwing at runtime - the front page was 500 for two days that way.
    - cron: '17 * * * *'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    # Scheduled runs only: check the live site, not the pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production routes
        run: |
          fail=0
          for p in /de /en /de/live /de/ticker /de/c/politics /de/c/world /de/markets; do
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "https://www.plain-news.ch$p" || echo 000)
            echo "$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "::error::plain-news.ch liefert keine 200 auf allen Haupt-Routen"
            exit 1
          fi

  routes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CONTENT_SOURCE: files
        run: npm run build
      - name: Serve and check routes
        env:
          CONTENT_SOURCE: files
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/de || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          fail=0
          for p in /de /en /de/live /de/ticker /de/c/politics /de/c/world /de/markets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p" || echo 000)
            echo "$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "--- server.log ---"
            tail -80 server.log
            exit 1
          fi
