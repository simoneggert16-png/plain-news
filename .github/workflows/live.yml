name: Live tickers

# GitHub's scheduled workflows are heavily throttled: a */10 cron is often only
# dispatched every 4-5 hours in practice. That is why the tickers looked dead
# (last update 08:40 while the event was still running). So the job now starts
# once, loops for ~5 hours with a 10-minute cycle, and commits after every
# cycle. The next scheduled run is queued while the loop is still going, so
# coverage stays continuous.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      create:
        description: 'Force-open a new ticker: title of the event (leave empty for a normal run)'
        type: string
        required: false
      keywords:
        description: 'Comma-separated keywords for the forced ticker, e.g. "israel,knesset,wahl"'
        type: string
        required: false
      end:
        description: 'Slug of a ticker to close'
        type: string
        required: false
      hours:
        description: 'How long the loop should run (default 5, max 5.5)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"

      - name: Update live tickers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCED_CREATE: ${{ inputs.create }}
          FORCED_KEYWORDS: ${{ inputs.keywords }}
          FORCED_END: ${{ inputs.end }}
          LOOP_HOURS: ${{ inputs.hours }}
          LIVE_WINDOW_HOURS: '6'
          LIVE_PER_FEED: '25'
          LIVE_MIN_SOURCES: '2'
          LIVE_MIN_OUTLETS_CREATE: '4'
          LIVE_MAX_NEW_TICKERS: '1'
          LIVE_MAX_UPDATES_PER_RUN: '3'
          LIVE_ARTICLE_REFRESH_MIN: '25'
          LIVE_IDLE_END_HOURS: '12'
          LIVE_AUTO_CREATE: '1'
          LIVE_TRANSLATE_CONCURRENCY: '4'
        run: |
          set -u

          # Manual one-off commands (force-open / close) run exactly once.
          if [ -n "$FORCED_CREATE" ]; then
            node bots/live.mjs --create "$FORCED_CREATE" --keywords "$FORCED_KEYWORDS"
            sleep 5
          elif [ -n "$FORCED_END" ]; then
            node bots/live.mjs --end "$FORCED_END"
            sleep 5
          fi

          if [ -n "$FORCED_CREATE" ] || [ -n "$FORCED_END" ]; then
            timeout 600 node scripts/sync-content.mjs || echo "supabase mirror skipped"
            git add content
            git diff --cached --quiet || {
              git commit -m "live: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull --rebase --autostash && git push
            }
            exit 0
          fi

          HOURS="${LOOP_HOURS:-5}"
          DEADLINE=$(( $(date +%s) + $(python3 -c "print(int(float('$HOURS')*3600))") ))

          # Every push to main is a Vercel deployment, and the Hobby plan
          # allows 100 per day. The push costs a build; the commit does not.
          # So the loop keeps committing every cycle and pushes on a slower
          # cadence - the ticker text itself only refreshes every 25 minutes.
          PUSH_EVERY=${LIVE_PUSH_EVERY_SEC:-2700}
          LAST_PUSH=0

          push_now() {
            for attempt in 1 2 3 4; do
              if git pull --rebase --autostash; then git push && return 0; fi
              git rebase --abort 2>/dev/null || true
              if git fetch -q origin main && git merge -q --no-edit -X ours origin/main; then
                node scripts/sync-index.mjs --missing || true
                node scripts/check-content.mjs --fix || true
                git add content
                git commit -q -m "live: merge upstream" || true
                git push && return 0
              fi
              git merge --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            return 1
          }

          echo "Loop for ${HOURS}h (until $(date -u -d @$DEADLINE +'%H:%M') UTC)"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CYCLE_START=$(date +%s)
            echo "──────── cycle $(date -u +'%Y-%m-%d %H:%M:%S') UTC ────────"

            git pull --rebase --autostash || git rebase --abort || true

            # A failing cycle must not kill the loop: the next one may succeed.
            node bots/live.mjs || echo "live.mjs exited $?"

            timeout 600 node scripts/sync-content.mjs || echo "supabase mirror skipped"

            # Never commit while a rebase from the previous attempt is half
            # resolved - that is how conflict markers reached index.json.
            if ! node scripts/check-content.mjs --fix; then
              echo "content/index.json is broken - not committing this cycle"
              git reset -q
              git rebase --abort 2>/dev/null || true
            else
              git add content
              if git diff --cached --quiet; then
                echo "No changes"
              else
                git commit -q -m "live: $(date -u +'%Y-%m-%d %H:%M') UTC"
              fi
              if [ $(( $(date +%s) - LAST_PUSH )) -ge "$PUSH_EVERY" ]; then
                if push_now; then LAST_PUSH=$(date +%s); fi
              else
                echo "Holding the push until the window opens"
              fi
            fi

            # Keep a 10-minute cadence measured from the cycle start.
            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            REMAIN=$(( 600 - ELAPSED ))
            if [ "$REMAIN" -gt 0 ]; then sleep "$REMAIN"; else sleep 5; fi
          done

          echo "Loop finished"

          # The window may still be open. What is committed has to go out now:
          # the run ends here, so nobody else will push it.
          git add content
          if ! git diff --cached --quiet; then
            git commit -q -m "live: $(date -u +'%Y-%m-%d %H:%M') UTC"
          fi
          push_now || echo "push failed after retries"
