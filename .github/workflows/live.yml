name: Live tickers

# GitHub's scheduled workflows are heavily throttled: a */10 cron is often only
# dispatched every 4-5 hours in practice. That is why the tickers looked dead
# (last update 08:40 while the event was still running). So the job now starts
# once, loops for ~5 hours with a 10-minute cycle, and commits after every
# cycle. The next scheduled run is queued while the loop is still going, so
# coverage stays continuous.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      create:
        description: 'Force-open a new ticker: title of the event (leave empty for a normal run)'
        type: string
        required: false
      keywords:
        description: 'Comma-separated keywords for the forced ticker, e.g. "israel,knesset,wahl"'
        type: string
        required: false
      end:
        description: 'Slug of a ticker to close'
        type: string
        required: false
      hours:
        description: 'How long the loop should run (default 5, max 5.5)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"

      - name: Update live tickers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCED_CREATE: ${{ inputs.create }}
          FORCED_KEYWORDS: ${{ inputs.keywords }}
          FORCED_END: ${{ inputs.end }}
          LOOP_HOURS: ${{ inputs.hours }}
          LIVE_WINDOW_HOURS: '6'
          LIVE_PER_FEED: '25'
          LIVE_MIN_SOURCES: '2'
          LIVE_MIN_OUTLETS_CREATE: '4'
          LIVE_MAX_NEW_TICKERS: '1'
          LIVE_MAX_UPDATES_PER_RUN: '3'
          LIVE_ARTICLE_REFRESH_MIN: '25'
          LIVE_IDLE_END_HOURS: '12'
          LIVE_AUTO_CREATE: '1'
          LIVE_TRANSLATE_CONCURRENCY: '4'
        run: |
          set -u

          # Manual one-off commands (force-open / close) run exactly once.
          if [ -n "$FORCED_CREATE" ]; then
            node bots/live.mjs --create "$FORCED_CREATE" --keywords "$FORCED_KEYWORDS"
            sleep 5
          elif [ -n "$FORCED_END" ]; then
            node bots/live.mjs --end "$FORCED_END"
            sleep 5
          fi

          if [ -n "$FORCED_CREATE" ] || [ -n "$FORCED_END" ]; then
            node scripts/sync-content.mjs || echo "supabase mirror skipped"
            git add content
            git diff --cached --quiet || {
              git commit -m "live: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull --rebase --autostash && git push
            }
            exit 0
          fi

          HOURS="${LOOP_HOURS:-5}"
          DEADLINE=$(( $(date +%s) + $(python3 -c "print(int(float('$HOURS')*3600))") ))

          echo "Loop for ${HOURS}h (until $(date -u -d @$DEADLINE +'%H:%M') UTC)"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CYCLE_START=$(date +%s)
            echo "──────── cycle $(date -u +'%Y-%m-%d %H:%M:%S') UTC ────────"

            git pull --rebase --autostash || git rebase --abort || true

            # A failing cycle must not kill the loop: the next one may succeed.
            node bots/live.mjs || echo "live.mjs exited $?"

            node scripts/sync-content.mjs || echo "supabase mirror skipped"

            git add content
            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -q -m "live: $(date -u +'%Y-%m-%d %H:%M') UTC"
              for attempt in 1 2 3; do
                git pull --rebase --autostash && git push && break
                sleep $((attempt * 10))
              done
            fi

            # Keep a 10-minute cadence measured from the cycle start.
            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            REMAIN=$(( 600 - ELAPSED ))
            if [ "$REMAIN" -gt 0 ]; then sleep "$REMAIN"; else sleep 5; fi
          done

          echo "Loop finished"
