name: Model probe

# Read-only diagnostic: which model answers right now, and how fast. Run it
# (Actions -> Model probe -> Run workflow) when the desk or the newsroom stops
# writing. A chain can lose every member at once — a monthly cap on one
# provider, a retired model on the other — and the logs then look like slow
# work instead of a desk with no brain.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article for the translation timing (empty = a default one)'
        default: ''
      models:
        description: 'Comma-separated models to test one by one (empty = the live chain)'
        default: ''
      budget:
        description: 'Seconds the whole translation may take'
        default: '300'
      maxtokens:
        description: 'Answer length the model may use'
        default: '10000'
      size:
        description: 'Prompt sizes to test (words), e.g. 20,200,500 — empty skips'
        default: ''

permissions:
  contents: read
  # GitHub Models needs no new key, only permission for the job token.
  models: read

concurrency:
  group: model-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A model list is the question "what works today" and takes minutes; a
      # translation test with named models skips it.
      - name: Ask every candidate one small question
        if: inputs.models == '' && inputs.size == ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/probe-models.mjs
      - name: Grow the prompt until the model stops answering
        if: inputs.size != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PROBE_MODELS: ${{ inputs.models }}
          PROBE_SIZES: ${{ inputs.size }}
          PROBE_MAX_TOKENS: ${{ inputs.maxtokens }}
        run: node scripts/probe-size.mjs
      - name: Translate one whole article
        if: always() && inputs.size == ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          PROBE_SLUG: ${{ inputs.slug }}
          PROBE_LOCALES: de
          PROBE_MODELS: ${{ inputs.models }}
          PROBE_BUDGET_MS: ${{ fromJSON(inputs.budget) }}000
          TRANSLATE_TIMEOUT_MS: ${{ fromJSON(inputs.budget) }}000
          TRANSLATE_MAX_TOKENS: ${{ inputs.maxtokens }}
          TRANSLATE_DEBUG: '1'
        run: node scripts/probe-translate.mjs
