name: Newsroom chain

# GitHub's scheduler delivers the Newsroom cron only a handful of times per day
# (scheduled runs regularly arrive 3-7 h late), so the site went stale between
# cycles. A finished Newsroom run therefore starts the next one itself:
# workflow_run always fires, and a workflow_dispatch created with GITHUB_TOKEN
# is the one token-triggered event GitHub still accepts. The scheduled cron
# stays as a backstop in case the chain ever breaks.

on:
  workflow_run:
    workflows: [Newsroom]
    types: [completed]
  workflow_dispatch:
    inputs:
      delay:
        description: Seconds to wait before dispatching (0 = immediately)
        default: '0'

permissions:
  actions: write
  contents: read

concurrency:
  group: newsroom-chain
  cancel-in-progress: false

jobs:
  chain:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch the next newsroom run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delay="${{ inputs.delay }}"
          if [ -z "$delay" ]; then delay=1500; fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=content&per_page=1" \
            --jq '.[0].commit.committer.date')
          mins=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "Last content commit was ${mins} min ago; planned delay ${delay}s."
          if [ "$mins" -ge 120 ]; then
            echo "Nothing published for ${mins} min - not chaining, the cron backstop will restart."
            exit 0
          fi
          # Wait out the cadence guard (25 min) so the next run does real work
          # instead of immediately skipping itself.
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          gh workflow run newsroom.yml --ref "${{ github.event.workflow_run.head_branch || 'main' }}"
          echo "Dispatched the next newsroom run."
