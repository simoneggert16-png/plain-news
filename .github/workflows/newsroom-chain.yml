name: Newsroom chain

# GitHub's scheduler delivers the Newsroom cron only a handful of times per day
# (scheduled runs regularly arrive 3-7 h late), so the site went stale between
# cycles. The newsroom run therefore hands over to this job before it ends:
# wait out the cadence guard, then start the next newsroom run. The scheduled
# cron stays as a backstop in case the chain ever breaks.

on:
  # Started by the newsroom run itself (workflow_dispatch) shortly before it
  # ends: it waits out the cadence guard, then starts the next run. workflow_run
  # cannot be used here - it does not fire for runs created with GITHUB_TOKEN.
  workflow_dispatch:
    inputs:
      delay:
        description: Seconds to wait before dispatching (0 = immediately)
        default: '1800'

permissions:
  actions: write
  contents: read

concurrency:
  group: newsroom-chain
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch the next newsroom run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delay="${{ inputs.delay }}"
          if [ -z "$delay" ]; then delay=1800; fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=content&per_page=1" \
            --jq '.[0].commit.committer.date')
          mins=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "Last content commit was ${mins} min ago; planned delay ${delay}s."
          if [ "$mins" -ge 120 ]; then
            echo "Nothing published for ${mins} min - not chaining, the cron backstop will restart."
            exit 0
          fi
          # Wait out the cadence guard (25 min) so the next run does real work
          # instead of immediately skipping itself.
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          gh workflow run newsroom.yml --ref main
          echo "Dispatched the next newsroom run."
