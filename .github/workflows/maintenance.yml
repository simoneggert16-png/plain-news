name: Maintenance

on:
  schedule:
    - cron: '40 3 * * *'     # daily 03:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run maintenance bot
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: node bots/maintenance.mjs
      - name: Verify the site still builds
        run: npm run build
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-content.mjs --fix
          bash scripts/push-content.sh "maintenance: $(date -u +'%Y-%m-%d')" || echo "the cleanup is committed but not published"
