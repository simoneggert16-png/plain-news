name: Maintenance

on:
  schedule:
    - cron: '40 3 * * *'     # daily 03:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-bots
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run maintenance bot
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node bots/maintenance.mjs
      - name: Verify the site still builds
        run: npm run build
      - name: Commit
        run: |
          git config user.name  "plain-maintenance-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "maintenance: $(date -u +'%Y-%m-%d') "
          git pull --rebase
          git push
