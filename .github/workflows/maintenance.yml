name: Maintenance

on:
  schedule:
    - cron: '40 3 * * *'     # daily 03:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run maintenance bot
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: node bots/maintenance.mjs
      - name: Verify the site still builds
        run: npm run build
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "simoneggert16-png"
          git config user.email "simoneggert16@gmail.com"
          node scripts/check-content.mjs --fix
          git add content
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "maintenance: $(date -u +'%Y-%m-%d') "
          # Every push is a Vercel deployment. When the day's budget is spent
          # the cleanup waits for the next window.
          if ! node scripts/deploy-budget.mjs; then
            echo "The day's deployments are spent - the cleanup waits."
            exit 0
          fi
          for attempt in 1 2 3 4; do
            if git pull -q --rebase; then git push -q && break; fi
            git rebase --abort 2>/dev/null || true
            if git fetch -q origin main && git merge -q --no-edit -X ours origin/main; then
              node scripts/sync-index.mjs --missing || true
              node scripts/check-content.mjs --fix || break
              git add content
              git commit -q -m "maintenance: merge upstream" || true
              git push -q && break
            fi
            git merge --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
