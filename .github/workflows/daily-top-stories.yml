name: Daily top stories

on:
  schedule:
    # Pair with the local-time guard for 07:30 Europe/Zurich across DST changes.
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: daily-top-stories
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send the daily digest to the requested addresses
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_TOPSTORIES_RECIPIENTS_ONCE }}
          NEWSLETTER_DAILY_SEND: 'true'
          NEWSLETTER_ARTICLE_LIMIT: '50'
        run: node scripts/send_newsletter.mjs
